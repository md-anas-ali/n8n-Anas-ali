# =============================================================================
# Render Blueprint — n8n (Docker) on the Free instance (0.1 CPU / 512MB RAM)
# Put this file + your Dockerfile in the repo root, then in Render dashboard:
# New -> Blueprint -> select this repo -> Apply.
# =============================================================================
services:
  - type: web
    name: n8n-shorts-automation
    runtime: docker
    plan: free
    region: singapore          # closest region to Bangladesh; change if you like
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true

    envVars:
      # ---- Core n8n / URL settings ----------------------------------------
      # N8N_HOST, WEBHOOK_URL: leave blank in dashboard until AFTER first
      # deploy, then fill with your actual Render URL, e.g.
      # n8n-shorts-automation.onrender.com / https://n8n-shorts-automation.onrender.com
      # (needed for Google/YouTube/Gmail OAuth redirect callbacks to work)
      - key: N8N_HOST
        sync: false
      - key: N8N_PROTOCOL
        value: https
      - key: WEBHOOK_URL
        sync: false

      # ---- Secure the editor (Render Free URL is public by default) ------
      - key: N8N_BASIC_AUTH_ACTIVE
        value: "true"
      - key: N8N_BASIC_AUTH_USER
        sync: false
      - key: N8N_BASIC_AUTH_PASSWORD
        sync: false

      # ---- Encryption key for stored credentials --------------------------
      # Render can auto-generate this once and keep it stable across deploys.
      # IMPORTANT: never regenerate after first deploy or saved credentials
      # (Gmail/Sheets/YouTube OAuth) become unreadable.
      - key: N8N_ENCRYPTION_KEY
        generateValue: true

      # ---- Workflow's own API keys (fill these in the Render dashboard) --
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: YOUTUBE_DATA_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false            # optional — falls back to a default voice id
      - key: NOTIFY_WEBHOOK_URL
        sync: false            # optional — Slack/Discord alert webhook
      - key: APP_REFERER_URL
        sync: false            # optional — your own Render URL, used as OpenRouter's HTTP-Referer

      # ---- Database: use the Postgres instance below instead of sqlite ---
      # n8n has no single DATABASE_URL var — it needs these split out.
      # fromDatabase pulls each piece straight from the Internal Database
      # URL of "n8n-postgres" below (internal = free, no egress, faster).
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: n8n-postgres
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: n8n-postgres
          property: port
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: n8n-postgres
          property: database
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: n8n-postgres
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: n8n-postgres
          property: password

    # ---- No disk block on purpose --------------------------------------
    # Render Free web services don't support persistent disks — but that's
    # fine now: workflows/credentials/executions live in n8n-postgres below,
    # not in the container filesystem, so they survive every redeploy.
    # /home/node/.n8n on disk is still used for temp/binary passthrough
    # files only (cleared each run by the workflow's own cleanup nodes).

databases:
  - name: n8n-postgres
    plan: free              # NOTE: Render's free Postgres is auto-deleted
                             # after 90 days unless upgraded to a paid plan —
                             # for real production, budget for that upgrade.
    region: singapore        # keep the same region as the web service above
                             # (internal networking only works within a region)
    databaseName: n8n
    user: n8n
